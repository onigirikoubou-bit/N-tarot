<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数秘タロット鑑定アプリ</title>
    <!-- 神秘的なフォントとゴシック体の読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            background: linear-gradient(135deg, #e8f4f1 0%, #d4e7e2 100%);
            color: #2c3e50;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        /* タイトルクリックで初期状態（リセット）に */
        h1 {
            text-align: center;
            color: #2c3e50;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-size: 28px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        h1:hover {
            opacity: 0.7;
        }
        .main-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
        }
        .left-area {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .right-area {
            width: 340px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* カードデッキ・山札のデザイン */
        .deck-container {
            position: relative;
            width: 160px;
            height: 235px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: transform 0.2s ease;
        }
        .deck-container:hover {
            transform: translateY(-5px);
        }
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 3px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-back::after {
            content: "✦";
            font-size: 40px;
            color: #d4af37;
        }
        .deck-shadow-1 { position: absolute; top: -4px; left: -4px; width: 100%; height: 100%; background: #334155; border-radius: 10px; z-index: -1; border: 1px solid #cbd5e1; }
        .deck-shadow-2 { position: absolute; top: -8px; left: -8px; width: 100%; height: 100%; background: #475569; border-radius: 10px; z-index: -2; border: 1px solid #cbd5e1; }

        /* めくったカードを並べるコンテナ */
        .cards-display-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .tarot-card {
            background: #ffffff;
            color: #2c3e50;
            border-radius: 10px;
            width: 210px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #cbd5e1;
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* カードのイラスト風フレーム */
        .card-illust-frame {
            width: 100%;
            height: 120px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border: 1px solid rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }
        
        .card-number {
            font-family: 'Cinzel', serif;
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.9);
            z-index: 2;
        }

        .color-blue { color: #1d4ed8; }
        .color-red { color: #b91c1c; }
        .color-black { color: #0f172a; }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            background: #34495e;
            color: #ffffff;
            padding: 5px 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        .card-details {
            font-size: 11px;
            text-align: left;
            width: 100%;
            line-height: 1.4;
            color: #475569;
        }
        
        .card-keywords {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            color: #1e293b;
        }

        /* 右側フォーム要素 */
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            background: #f8fafc;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: 'Noto Serif JP', serif;
            box-sizing: border-box;
        }
        select:focus, textarea:focus {
            outline: none;
            border-color: #34495e;
        }
        textarea {
            height: 75px;
            resize: vertical;
        }
        .action-btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-family: 'Noto Serif JP', serif;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
            text-align: center;
            width: 100%;
        }
        .action-btn:hover:not(:disabled) {
            background: #1a252f;
            transform: translateY(-1px);
        }
        .action-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .hidden {
            display: none;
        }

        /* 鑑定結果エリア（文字サイズ 16px） */
        .result-container {
            width: 100%;
            margin-top: 30px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .result-container h2 {
            margin-top: 0;
            font-family: 'Cinzel', serif;
            color: #34495e;
            font-size: 18px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .result-content {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 16px;
            color: #334155;
        }
    </style>
</head>
<body>

    <!-- タイトルクリックで初期状態（リセット）に -->
    <h1 id="app-title" title="クリックしてリセット">数秘タロット鑑定アプリ</h1>

    <div class="main-container">
        <!-- 左側：山札・カード表示 -->
        <div class="left-area">
            <div class="deck-container" id="deck-btn" title="クリックしてカードを引く">
                <div class="deck-shadow-2"></div>
                <div class="deck-shadow-1"></div>
                <div class="card-back"></div>
            </div>
            <div id="deck-status" style="font-size: 13px; color: #475569; margin-bottom: 10px; font-weight: bold;">カードを引いてください (0 / 最大3枚)</div>

            <div class="cards-display-area" id="cards-display"></div>
        </div>

        <!-- 右側：相談内容の選択 -->
        <div class="right-area">
            <div style="font-weight: bold; font-size: 15px; margin-bottom: 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; color: #1e293b;">鑑定設定</div>

            <div class="form-group">
                <label for="consultation-select">相談内容を選択</label>
                <select id="consultation-select">
                    <option value="過去・現在・未来">過去・現在・未来</option>
                    <option value="現状維持 or アクション">現状維持 or アクション</option>
                    <option value="性格診断">性格診断</option>
                    <option value="職業診断、私の才能">職業診断、私の才能</option>
                    <option value="人間関係">人間関係</option>
                    <option value="自分の知らない深層心理">自分の知らない深層心理</option>
                    <option value="生まれてきた意味">生まれてきた意味</option>
                    <option value="other">テキスト入力</option>
                </select>
            </div>

            <div class="form-group hidden" id="custom-question-group">
                <label for="custom-question">具体的なご相談内容（テキスト入力）</label>
                <textarea id="custom-question" placeholder="具体的なお悩みをご記入ください..."></textarea>
            </div>

            <button class="action-btn" id="ai-reading-btn" disabled style="margin-top: 10px;">Gemini APIで鑑定する</button>
        </div>
    </div>

    <!-- 鑑定結果 -->
    <div class="result-container hidden" id="result-box">
        <h2>Gemini AI Interpretation</h2>
        <div class="result-content" id="result-display">鑑定中...</div>
    </div>

    <script>
        const tarotData = [
            { number: 0, name: "0. 虚空 / 始まり", colorClass: "color-blue", bg: "linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%)", keywords: ["無限の可能性", "純粋無垢", "自由", "スタートライン"], meaning: "すべての可能性を秘めたゼロの状態。固定観念を手放し、純粋な気持ちで新しい一歩を踏み出す時です。" },
            { number: 1, name: "1. 創造 / スタート", colorClass: "color-blue", bg: "linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%)", keywords: ["意志", "独創性", "行動力", "意志の力"], meaning: "強い意志を持って物事を始動させるエネルギー。自分の内なるパワーを信じて形にするタイミングです。" },
            { number: 2, name: "2. 調和 / 受容", colorClass: "color-blue", bg: "linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%)", keywords: ["直感", "バランス", "内省", "パートナーシップ"], meaning: "内面を深く見つめ直す時。直感を信じ、物事のバランスや協調性を大切にしましょう。" },
            { number: 3, name: "3. 表現 / 豊かさ", colorClass: "color-blue", bg: "linear-gradient(135deg, #fae8ff 0%, #f5d0fe 100%)", keywords: ["創造性", "喜び", "コミュニケーション", "拡大"], meaning: "感性が豊かになり、自己表現やクリエイティブな活動が実を結ぶ時。楽しむ心が幸運を引き寄せます。" },
            { number: 4, name: "4. 安定 / 秩序", colorClass: "color-black", bg: "linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%)", keywords: ["基盤", "努力", "現実的", "安心感"], meaning: "着実な努力と堅実な基盤作りが求められる時。コツコツと積み重ねてきたことが形になります。" },
            { number: 5, name: "5. 変化 / 自由", colorClass: "color-red", bg: "linear-gradient(135deg, #fee2e2 0%, #fecaca 100%)", keywords: ["冒険", "柔軟性", "転換期", "好奇心"], meaning: "予期せぬ変化や新しい風が吹く時。柔軟に対応することで視野が大きく広がります。" },
            { number: 6, name: "6. 愛と調和 / 奉仕", colorClass: "color-blue", bg: "linear-gradient(135deg, #ccfbf1 0%, #99f6e4 100%)", keywords: ["愛情", "責任", "美意識", "癒やし"], meaning: "人間関係や身近な人への愛情がテーマになる時。心からの思いやりが満たされます。" },
            { number: 7, name: "7. 内省 / 探求", colorClass: "color-red", bg: "linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%)", keywords: ["精神性", "専門性", "一人の時間", "真実"], meaning: "立ち止まって深く思考したり、物事を徹底的に探求したりする時。内なる声に耳を傾けます。" },
            { number: 8, name: "8. 力と達成 / 循環", colorClass: "color-blue", bg: "linear-gradient(135deg, #fef9c3 0%, #fef08a 100%)", keywords: ["パワー", "豊かさの循環", "達成", "リーダーシップ"], meaning: "これまでの努力が実を結び、成果や富を手にする時。自信を持って行動しましょう。" },
            { number: 9, name: "9. 完結 / 知恵", colorClass: "color-black", bg: "linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%)", keywords: ["手放し", "慈愛", "精神的成熟", "サイクルの終わり"], meaning: "一つの大きなサイクルが終わりを迎える時。不要なものを手放しましょう。" },
            { number: 10, name: "10. 運命の輪 / 転換", colorClass: "color-blue", bg: "linear-gradient(135deg, #e0f2fe 0%, #7dd3fc 100%)", keywords: ["運命", "チャンス", "サイクルの転換", "流れに乗る"], meaning: "運命の歯車が大きく動き出すタイミング。巡ってきたチャンスの波に乗りましょう。" },
            { number: 11, name: "11. 直感の覚醒（マスター）", colorClass: "color-blue", bg: "linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%)", keywords: ["直感力", "霊感", "インスピレーション", "メッセンジャー"], meaning: "非常に高い直感力やひらめきが降りてくるマスターナンバー。直感を信じましょう。" },
            { number: 12, name: "12. 視点の転換 / 奉仕", colorClass: "color-red", bg: "linear-gradient(135deg, #fee2e2 0%, #fca5a5 100%)", keywords: ["自己犠牲", "視点を変える", "忍耐", "修行"], meaning: "あえて動きを止め、物事を逆の視点から見てみる時。新しい気づきが得られます。" },
            { number: 13, name: "13. 浄化と再生", colorClass: "color-red", bg: "linear-gradient(135deg, #fecdd3 0%, #fda4af 100%)", keywords: ["変容", "リセット", "古いものの終焉", "生まれ変わり"], meaning: "劇的な変化を通して、新しい自分に生まれ変わる時。すっきりとリセットしましょう。" },
            { number: 14, name: "14. 節度と統合", colorClass: "color-blue", bg: "linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%)", keywords: ["バランス", "浄化", "中庸", "調和"], meaning: "相反する要素を上手にミックスし、ちょうどよいバランスを見出す時です。" },
            { number: 15, name: "15. 束縛からの解放", colorClass: "color-red", bg: "linear-gradient(135deg, #ffe0b2 0%, #ffcc80 100%)", keywords: ["情熱", "執着", "誘惑", "現実的エネルギー"], meaning: "強い情熱や固定観念に気づく時。本当に大切なものを見極めましょう。" },
            { number: 16, name: "16. 崩壊と目覚め", colorClass: "color-red", bg: "linear-gradient(135deg, #ffcdd2 0%, #ef9a9a 100%)", keywords: ["塔の崩壊", "価値観の覆り", "突然の気づき", "真実の顕現"], meaning: "これまでの思い込みが崩れ、本質的な真実に目覚める時です。" },
            { number: 17, name: "17. 希望とインスピレーション", colorClass: "color-blue", bg: "linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 100%)", keywords: ["星", "希望", "ひらめき", "癒やしと導き"], meaning: "暗闇の中に輝く星のような、明るい希望や理想が見えてくる時です。" },
            { number: 18, name: "18. 潜在意識と直感", colorClass: "color-red", bg: "linear-gradient(135deg, #ede7f6 0%, #d1c4e9 100%)", keywords: ["月", "不安の克服", "潜在意識", "イマジネーション"], meaning: "見えない未来への不安や心の奥にある感情に向き合う時です。" },
            { number: 19, name: "19. 祝福と成功", colorClass: "color-blue", bg: "linear-gradient(135deg, #fff9c4 0%, #fff59d 100%)", keywords: ["太陽", "喜び", "成功", "生命力"], meaning: "明るい光がすべてを照らし出し、喜びや成功を実感できる最高のタイミング。" },
            { number: 20, name: "20. 復活とメッセージ", colorClass: "color-blue", bg: "linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%)", keywords: ["審判", "復活", "決断", "結果の受容"], meaning: "過去の努力が蘇り、大きな決断や答えが下される時です。" },
            { number: 21, name: "21. 完全なる調和", colorClass: "color-blue", bg: "linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%)", keywords: ["世界", "完成", "統合", "ハッピーエンド"], meaning: "一つの大きな世界が完成し、調和と達成感に包まれる時です。" },
            { number: 22, name: "22. 偉大なる構築（マスター）", colorClass: "color-blue", bg: "linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%)", keywords: ["大事業", "カリスマ", "現実化の極み", "理想の具現化"], meaning: "スケールの大きな理想を現実社会にしっかりと定着させるマスターナンバー。" },
            { number: 23, name: "23. 風のうねり / 自由探求", colorClass: "color-black", bg: "linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%)", keywords: ["機転", "スピード感", "軽やかさ", "情報"], meaning: "フットワーク軽く動き回り、新しい情報や変化を取り入れる時です。" },
            { number: 24, name: "24. 優しさと育み", colorClass: "color-blue", bg: "linear-gradient(135deg, #e0f2f1 0%, #80cbc4 100%)", keywords: ["母性", "サポート", "安心の空間", "ケア"], meaning: "周囲の人を温かく包み込み、育んでいくエネルギーが満ちる時。" },
            { number: 25, name: "25. 新たな視点の探求", colorClass: "color-black", bg: "linear-gradient(135deg, #eceff1 0%, #cfd8dc 100%)", keywords: ["分析", "探究心", "真実の追求", "専門性"], meaning: "物事を冷静に分析し、表面的なことではなく本質を見抜こうとする時。" },
            { number: 26, name: "26. パートナーシップ", colorClass: "color-blue", bg: "linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%)", keywords: ["協調", "契約", "絆", "分かち合い"], meaning: "他者との深い信頼関係やパートナーシップがクローズアップされる時。" },
            { number: 27, name: "27. 直感と知恵の融合", colorClass: "color-blue", bg: "linear-gradient(135deg, #e0f7fa 0%, #80deea 100%)", keywords: ["ひらめき", "精神的成長", "慈愛の知恵", "内なる導き"], meaning: "経験から得た知恵と鋭いひらめきが美しく結びつく時です。" },
            { number: 28, name: "28. 自己信頼と自立", colorClass: "color-black", bg: "linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%)", keywords: ["自立心", "マイペース", "確信", "独自のスタイル"], meaning: "他人の意見に左右されず、自分の足でしっかりと立つ時です。" },
            { number: 29, name: "29. 転換期のひらめき", colorClass: "color-red", bg: "linear-gradient(135deg, #fbe9e7 0%, #ffab91 100%)", keywords: ["直感の導き", "ドラマチック", "感性", "受容"], meaning: "感情や直感が大きく揺り動かされるようなドラマチックな転換期です。" },
            { number: 30, name: "30. 表現の開花と喜び", colorClass: "color-blue", bg: "linear-gradient(135deg, #fce4ec 0%, #f48fb1 100%)", keywords: ["自己表現", "アート", "無邪気な喜び", "交流"], meaning: "内側からあふれる情熱やアイデアを形にして楽しく表現する時。" },
            { number: 31, name: "31. 誠実な努力と基盤", colorClass: "color-black", bg: "linear-gradient(135deg, #efebe9 0%, #d7ccc8 100%)", keywords: ["堅実", "継続", "プロフェッショナル", "信頼"], meaning: "地道な積み重ねが確かな信頼や実力を生み出す時です。" },
            { number: 32, name: "32. 心の交流と調和", colorClass: "color-blue", bg: "linear-gradient(135deg, #e8f5e9 0%, #a5d6a7 100%)", keywords: ["共感", "優しさ", "心の繋がり", "平和"], meaning: "人との温かいコミュニケーションや共感の輪が広がる時です。" },
            { number: 33, name: "33. 宇宙的愛と奉仕（マスター）", colorClass: "color-blue", bg: "linear-gradient(135deg, #ede7f6 0%, #b39ddb 100%)", keywords: ["無条件の愛", "スケールの大きな癒やし", "精神的導き", "ユーモア"], meaning: "すべてを包み込むような大きな愛と、自由な魂を持つマスターナンバー。" }
        ];

        let drawnCards = [];
        let clickCount = 0;
        const maxDraws = 3; // 最大3枚まで
        let shuffledDeck = [];

        const appTitle = document.getElementById('app-title');
        const deckBtn = document.getElementById('deck-btn');
        const deckStatus = document.getElementById('deck-status');
        const cardsDisplay = document.getElementById('cards-display');
        const consultationSelect = document.getElementById('consultation-select');
        const customGroup = document.getElementById('custom-question-group');
        const aiReadingBtn = document.getElementById('ai-reading-btn');
        const resultBox = document.getElementById('result-box');
        const resultDisplay = document.getElementById('result-display');

        // タイトルをクリックしたら初期状態（リセット）にする
        appTitle.addEventListener('click', () => {
            consultationSelect.value = "過去・現在・未来";
            customGroup.classList.add('hidden');
            document.getElementById('custom-question').value = '';
            initDeck();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        consultationSelect.addEventListener('change', (e) => {
            if (e.target.value === 'other') {
                customGroup.classList.remove('hidden');
            } else {
                customGroup.classList.add('hidden');
            }
        });

        function initDeck() {
            shuffledDeck = [...tarotData].sort(() => 0.5 - Math.random());
            drawnCards = [];
            clickCount = 0;
            cardsDisplay.innerHTML = '';
            resultBox.classList.add('hidden');
            aiReadingBtn.disabled = true;
            deckBtn.style.pointerEvents = 'auto';
            deckStatus.textContent = `カードを引いてください (0 / 最大${maxDraws}枚)`;
        }

        deckBtn.addEventListener('click', () => {
            if (clickCount >= maxDraws) return;

            const card = shuffledDeck[clickCount];
            drawnCards.push(card);
            clickCount++;

            deckStatus.textContent = `カードを引いています (${clickCount} / ${maxDraws}枚)`;

            const numMatch = card.name.match(/^(\d+)\.\s*(.+)$/);
            const cardNumStr = numMatch ? numMatch[1] : card.number;
            const cardTitleStr = numMatch ? numMatch[2] : card.name;

            const cardEl = document.createElement('div');
            cardEl.className = 'tarot-card';
            cardEl.innerHTML = `
                <div class="card-illust-frame" style="background: ${card.bg};">
                    <div class="card-number ${card.colorClass}">${cardNumStr}</div>
                </div>
                <div class="card-title">${cardTitleStr}</div>
                <div class="card-details">
                    <p style="margin: 4px 0;"><strong>キーワード:</strong> <span class="card-keywords">${card.keywords.join(', ')}</span></p>
                    <p style="margin: 4px 0;">${card.meaning}</p>
                </div>
            `;
            cardsDisplay.appendChild(cardEl);

            // 1枚以上引いた時点で、いつでもAI鑑定ボタンを押せるように有効化
            if (clickCount > 0) {
                aiReadingBtn.disabled = false;
            }

            // 3枚に達したら山札をクリックできないようにする
            if (clickCount >= maxDraws) {
                deckBtn.style.pointerEvents = 'none';
                deckStatus.textContent = `最大枚数（${maxDraws}枚）に達しました`;
            }
        });

        aiReadingBtn.addEventListener('click', async () => {
            if (drawnCards.length === 0) {
                alert('カードを1枚以上引いてください。');
                return;
            }

            let consultation = consultationSelect.value;
            if (consultation === 'other') {
                consultation = document.getElementById('custom-question').value.trim();
                if (!consultation) {
                    alert('具体的なご相談内容を入力してください。');
                    return;
                }
            }

            resultBox.classList.remove('hidden');
            
            let cardsInfoText = '';
            let cardsPromptText = '';
            drawnCards.forEach((card, index) => {
                cardsInfoText += `${index + 1}枚目: ${card.name}\n`;
                cardsPromptText += `${index + 1}枚目: ${card.name}\n- キーワード: ${card.keywords.join(', ')}\n- 意味: ${card.meaning}\n\n`;
            });

            resultDisplay.textContent = '【ご相談・テーマ】\n' + consultation + '\n\n【引いた数秘タロットカード】\n' + cardsInfoText +
                '\n✨ Gemini AIが心を込めて鑑定しています...しばらくお待ちください ✨';
            resultBox.scrollIntoView({ behavior: 'smooth' });

            const prompt = `こんにちは、数秘タロット占い師のセレスティアです。以下の相談内容と、ユーザーが引いた${drawnCards.length}枚の数秘タロットカードの情報を元に、深みと洞察力のある詳細な鑑定文を作成してください。

【相談内容・テーマ】
${consultation}

【引いたカード情報】
${cardsPromptText}

【鑑定の構成案】
1. セレスティアからのご挨拶と、引いた${drawnCards.length}枚のカードが持つ象徴的な全体インプレッション
2. 各カードの深い読み解き
3. 相談者への具体的なアドバイスとあたたかいエール

専門的でありながら、相談者の心に寄り添うような、神秘的で優雅なトーンで日本語で回答してください。`;

            try {
                const response = await fetch('/api/reading', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '鑑定の生成に失敗しました。');
                }

                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || '鑑定結果を取得できませんでした。';

                resultDisplay.textContent = '【ご相談・テーマ】\n' + consultation + '\n\n' +
                    '【引いた数秘タロットカード】\n' + cardsInfoText +
                    '━━━━━━━━━━━━━━━━━━━\n' +
                    '🔮 Gemini AI タロット鑑定結果\n' +
                    '━━━━━━━━━━━━━━━━━━━\n\n' + aiText;

            } catch (error) {
                resultDisplay.textContent = 'エラーが発生しました: ' + error.message;
            }
        });

        initDeck();
    </script>

</body>
</html>
